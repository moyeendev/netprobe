name: Release

# Runs when a version tag (v0.1.0, v0.2.0, ...) is pushed. Builds the sdist and wheel, checks
# that the tag matches the package version, smoke-tests the wheel on three operating systems
# and creates the GitHub release. Zenodo archives every GitHub release and mints a DOI once
# the repository is enabled at https://zenodo.org/account/settings/github/ (see RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/netprobe/__init__.py').read()).group(1))")
          p=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != __version__ $v"; exit 1; }
          test "$v" = "$p" || { echo "__version__ $v != pyproject version $p"; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel into a clean environment
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Smoke test (unprivileged loopback probes)
        shell: bash
        run: |
          python -m netprobe --version
          python -m netprobe server --bind 127.0.0.1 &
          sleep 2
          python -m netprobe delay 127.0.0.1 --count 10 --interval 0.05 --out smoke-delay
          python -m netprobe bandwidth 127.0.0.1 --duration 1 --out smoke-bw

  github-release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "NetProbe ${GITHUB_REF_NAME}" --notes-file <(awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
