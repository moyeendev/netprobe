name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit + loopback integration tests (unprivileged)
        run: pytest -q

  netem-smoke:
    # End-to-end check of the evaluation pipeline in a privileged container
    # (network namespaces + tc netem). Short durations only.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducibility image
        run: docker build -t netprobe-repro .
      - name: Quick reproduction
        run: |
          docker run --rm --privileged -e QUICK=1 -e RESULTS=/tmp/results \
            netprobe-repro bash examples/run_evaluation.sh
